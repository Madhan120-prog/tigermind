# Tier-1 domain registry. Adding a domain = an ingestion run + one entry
# here, never new agent code. See .claude/rules/architecture.md.

housing:
  collection: housing
  retrieval_mode: semantic
  freshness_tier: slow
  prompt_snippet: >
    You answer questions about University of Memphis on-campus housing:
    residence hall rates, hall types, contract and cancellation policies,
    and move-in/move-out dates.
  sources:
    - https://www.memphis.edu/reslife/housing101/housingrates.php
    - https://www.memphis.edu/reslife/reshalls/
    - https://www.memphis.edu/reslife/resources/housing.php
    - https://www.memphis.edu/reslife/about/faqs.php

student-employment:
  collection: student-employment
  retrieval_mode: semantic
  freshness_tier: slow
  prompt_snippet: >
    You answer questions about University of Memphis student employment:
    eligibility to work on campus, Federal Work-Study versus Regular
    Student Employment, weekly hour limits, pay, and how to find and apply
    for positions. Open positions are posted on TigerLink/Handshake, which
    is outside your data -- explain the process, never imply you can see
    live listings. International students have separate, stricter rules;
    if a question involves visa or immigration eligibility, defer to
    International Programs rather than answering.
  sources:
    - https://www.memphis.edu/studentemployment/
    - https://www.memphis.edu/studentemployment/faq_students.php
    - https://www.memphis.edu/scholarships/student_employment/sejobs.php
    - https://www.memphis.edu/scholarships/student_employment/sepay.php
    - https://www.memphis.edu/iss/current_international_students/employment_on_campus.php
  deferrals:
    - triggers: [international, f-1, f1, visa, immigration, opt, cpt, sevis]
      refer_to: >
        International Student Services, Brister Hall Room 120,
        901.678.4271
      because: >
        On-campus work limits for students on a visa depend on
        immigration status, and this domain's own sources disagree: the
        student employment pay page states F-1 students may work up to 40
        hours per week during school breaks, while the International
        Student Services page gives a 20-hour in-session limit and says
        nothing about breaks. Getting this wrong risks a status
        violation, so it needs an authoritative answer rather than a
        retrieved one.

faculty:
  collection: faculty
  retrieval_mode: structured
  freshness_tier: slow
  prompt_snippet: >
    You answer questions about University of Memphis faculty: who is in a
    department, their title, office location, phone and email, and their
    research areas. Contact details are the kind of fact where a wrong
    answer is worse than no answer, so quote them exactly from the context
    or say you don't have them. Watch for a person's status: an emeritus,
    retired or adjunct listing must never be presented as actively
    teaching. Office hours are not published in this data at all -- they
    appear on course syllabi, so say you don't have them rather than
    guessing. Only the Fogelman College of Business and Economics
    departments are ingested (Accountancy, Economics, Finance, Management,
    Marketing, MIS, Supply Chain Management); for anyone outside those, say
    the department isn't in your data rather than implying the person
    doesn't exist.
  source_discovery:
    sitemap: https://www.memphis.edu/sitemap.xml
    # Matches the URL shape rather than a list of departments, so a
    # department adopting this convention is picked up with no config
    # change. Other conventions need their own entry: Mechanical
    # Engineering publishes at /me/faculty/{slug}.php with inconsistent
    # slugs and non-person pages mixed in, so it is not covered here.
    include: /[a-z0-9-]+/faculty/faculty-directory/[a-z0-9-]+\.php$
    record_key_from: /faculty-directory/([a-z0-9-]+)\.php$

fees:
  collection: fees
  retrieval_mode: hybrid
  freshness_tier: slow
  prompt_snippet: >
    You answer questions about University of Memphis tuition and fees:
    flat fees (late payment, application, dining, mail services), payment
    plan mechanics, and the undergraduate resident tuition-by-credit-hour
    schedule for 2025-26. This data covers exactly one track: standard
    campus, undergraduate, Tennessee resident. UofM Global, TNeCampus,
    non-resident, international, graduate and law rates are all priced
    differently and are not in your data -- say so rather than estimating
    from the resident rate you do have. A dollar figure always needs its
    academic year and track named alongside it, since the same credit-hour
    count prices differently across tracks and years.
  sources:
    - https://www.memphis.edu/usbs/fees/
    - https://www.memphis.edu/usbs/fees/2526fees/ug_resident.pdf
